<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Machine Learning Specialty — 4-Hour Instructor-Led Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --aws-orange: #c471ed;
  --aws-dark: #18072b;
  --aws-navy: #004aad;
  --aws-light: #eaeaee;
  --aws-blue: #004aad;
  --aws-teal: #afe6ed;
  --success: #2ECC71;
  --danger: #E74C3C;
  --warning: #f3bb06;
  --bg: #18072b;
  --card-bg: #1f0e38;
  --card-border: #3a2060;
  --text: #eaeaee;
  --text-muted: #8eb6dc;
  --radius: 12px;
  --gold: #f3bb06;
  --purple: #c471ed;
  --royal-blue: #004aad;
  --cyan: #afe6ed;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Nunito Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}
h1, h2, h3, h4, h5, h6 {
  font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
}
/* ── Scrollbar ── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

/* ── Top Nav ── */
.topbar {
  position: fixed; top:0; left:0; right:0; z-index:100;
  background: rgba(24,7,43,.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 56px;
}
.topbar-brand {
  display:flex; align-items:center; gap:10px;
  font-weight:700; font-size:1.1rem;
}
.topbar-brand .logo { color: var(--purple); font-size: 1.4rem; }
.topbar-timer {
  display:flex; align-items:center; gap:16px;
}
.timer-display {
  font-family: 'SF Mono', 'Cascadia Code', monospace;
  font-size: 1.35rem; font-weight: 700;
  color: var(--cyan);
  background: rgba(175,230,237,.08);
  padding: 4px 16px; border-radius: 8px;
  border: 1px solid rgba(175,230,237,.25);
  min-width: 110px; text-align:center;
}
.timer-label { font-size:.75rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
.btn {
  padding: 8px 18px; border:none; border-radius:8px;
  font-weight:600; font-size:.85rem; cursor:pointer;
  transition: all .2s;
}
.btn-orange { background: linear-gradient(135deg, var(--purple), var(--royal-blue)); color:#fff; }
.btn-orange:hover { background: linear-gradient(135deg, #d48ef2, #0058cc); transform:translateY(-1px); }
.btn-outline {
  background:transparent; color:var(--text);
  border:1px solid var(--card-border);
}
.btn-outline:hover { border-color:var(--aws-orange); color:var(--aws-orange); }
.btn-sm { padding:5px 12px; font-size:.8rem; }
.btn-success { background:var(--success); color:#000; }
.btn-danger { background:var(--danger); color:#fff; }

/* ── Layout ── */
.app { display:flex; margin-top:56px; min-height:calc(100vh - 56px); }

/* ── Sidebar ── */
.sidebar {
  width: 300px; min-width:300px;
  background: var(--card-bg);
  border-right: 1px solid var(--card-border);
  overflow-y: auto; height: calc(100vh - 56px);
  position: sticky; top:56px;
  padding: 16px 0;
}
.sidebar-section { margin-bottom: 8px; }
.sidebar-header {
  padding: 8px 20px; font-size:.7rem;
  text-transform:uppercase; letter-spacing:1.5px;
  color:var(--text-muted); font-weight:700;
}
.sidebar-item {
  display:flex; align-items:center; gap:10px;
  padding: 10px 20px; cursor:pointer;
  border-left:3px solid transparent;
  transition: all .15s;
  font-size:.9rem;
}
.sidebar-item:hover { background:rgba(255,255,255,.04); }
.sidebar-item.active {
  background:rgba(255,153,0,.08);
  border-left-color:var(--aws-orange);
  color:var(--aws-orange);
}
.sidebar-item.completed .dot { background:var(--success); }
.sidebar-item .dot {
  width:8px; height:8px; border-radius:50%;
  background:var(--card-border); flex-shrink:0;
}
.sidebar-item .time {
  margin-left:auto; font-size:.75rem;
  color:var(--text-muted); font-family:monospace;
}
.sidebar-progress {
  margin:12px 20px; padding:12px 16px;
  background:rgba(196,113,237,.06);
  border-radius:var(--radius);
  border:1px solid rgba(196,113,237,.15);
}
.progress-bar-bg {
  height:6px; background:var(--card-border);
  border-radius:3px; overflow:hidden; margin-top:8px;
}
.progress-bar-fill {
  height:100%; background:linear-gradient(90deg, var(--royal-blue), var(--purple));
  border-radius:3px; transition:width .4s;
}
.progress-text { font-size:.8rem; color:var(--text-muted); }

/* ── Main Content ── */
.main { flex:1; padding:32px 48px; max-width:960px; }

/* ── Module/Section Content ── */
.module-header {
  margin-bottom:32px; padding-bottom:20px;
  border-bottom:1px solid var(--card-border);
}
.module-badge {
  display:inline-block; padding:4px 12px; border-radius:20px;
  font-size:.75rem; font-weight:700; text-transform:uppercase;
  letter-spacing:1px; margin-bottom:12px;
}
.badge-domain1 { background:rgba(0,74,173,.15); color:#8eb6dc; }
.badge-domain2 { background:rgba(175,230,237,.12); color:var(--cyan); }
.badge-domain3 { background:rgba(196,113,237,.15); color:var(--purple); }
.badge-domain4 { background:rgba(243,187,6,.12); color:var(--gold); }
.badge-review { background:rgba(46,204,113,.15); color:var(--success); }
.badge-strategy { background:rgba(0,74,173,.15); color:#8eb6dc; }
.module-header h1 { font-size:1.8rem; margin-bottom:8px; }
.module-header p { color:var(--text-muted); font-size:1rem; }
.module-meta { display:flex; gap:20px; margin-top:12px; font-size:.85rem; color:var(--text-muted); }
.module-meta span { display:flex; align-items:center; gap:6px; }

/* ── Content Cards ── */
.content-card {
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:var(--radius); padding:24px; margin-bottom:20px;
}
.content-card h2 { font-size:1.2rem; margin-bottom:12px; color:var(--aws-orange); }
.content-card h3 { font-size:1.05rem; margin:16px 0 8px; color:var(--text); }
.content-card ul { padding-left:20px; }
.content-card li { margin-bottom:6px; color:var(--text); font-size:.92rem; }
.content-card li::marker { color:var(--aws-orange); }
.content-card p { margin-bottom:10px; font-size:.92rem; }
.content-card code {
  background:rgba(255,153,0,.1); color:var(--aws-orange);
  padding:2px 6px; border-radius:4px; font-size:.85rem;
}
.content-card pre {
  background:#0D1117; border:1px solid var(--card-border);
  padding:16px; border-radius:8px; overflow-x:auto;
  font-size:.85rem; margin:12px 0;
}
.content-card pre code { background:none; padding:0; }

/* ── Key Concepts ── */
.key-concept {
  border-left:3px solid var(--cyan);
  padding:12px 16px; margin:16px 0;
  background:rgba(175,230,237,.04);
  border-radius: 0 8px 8px 0;
}
.key-concept strong { color:var(--cyan); }

/* ── Exam Tip ── */
.exam-tip {
  border:1px solid rgba(196,113,237,.3);
  background:rgba(196,113,237,.06);
  padding:16px 20px; border-radius:var(--radius);
  margin:16px 0;
}
.exam-tip::before {
  content:'💡 EXAM TIP'; display:block;
  font-size:.75rem; font-weight:700; color:var(--aws-orange);
  letter-spacing:1px; margin-bottom:8px;
}

/* ── Service Table ── */
.service-table {
  width:100%; border-collapse:collapse; margin:16px 0;
  font-size:.88rem;
}
.service-table th {
  text-align:left; padding:10px 14px;
  background:rgba(255,153,0,.08);
  color:var(--aws-orange); font-weight:600;
  border-bottom:2px solid var(--aws-orange);
}
.service-table td {
  padding:10px 14px;
  border-bottom:1px solid var(--card-border);
}
.service-table tr:hover td { background:rgba(255,255,255,.02); }

/* ── Quiz ── */
.quiz-container { margin-top:24px; }
.quiz-question {
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:var(--radius); padding:24px; margin-bottom:16px;
}
.quiz-question .q-num {
  font-size:.75rem; font-weight:700;
  color:var(--aws-orange); text-transform:uppercase;
  letter-spacing:1px; margin-bottom:8px;
}
.quiz-question .q-text { font-size:1rem; margin-bottom:16px; font-weight:500; }
.quiz-option {
  display:flex; align-items:flex-start; gap:12px;
  padding:12px 16px; margin-bottom:8px;
  border:1px solid var(--card-border);
  border-radius:8px; cursor:pointer;
  transition:all .15s;
}
.quiz-option:hover { border-color:var(--aws-orange); background:rgba(255,153,0,.04); }
.quiz-option.selected { border-color:var(--aws-blue); background:rgba(32,116,213,.08); }
.quiz-option.correct { border-color:var(--success); background:rgba(46,204,113,.08); }
.quiz-option.incorrect { border-color:var(--danger); background:rgba(231,76,60,.08); }
.quiz-option .opt-letter {
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:.85rem; flex-shrink:0;
  border:2px solid var(--card-border); transition:all .15s;
}
.quiz-option.selected .opt-letter { border-color:var(--aws-blue); color:var(--aws-blue); }
.quiz-option.correct .opt-letter { border-color:var(--success); color:var(--success); background:rgba(46,204,113,.15); }
.quiz-option.incorrect .opt-letter { border-color:var(--danger); color:var(--danger); }
.quiz-explanation {
  margin-top:12px; padding:12px 16px;
  background:rgba(46,204,113,.06);
  border:1px solid rgba(46,204,113,.2);
  border-radius:8px; font-size:.88rem;
  display:none;
}
.quiz-explanation.visible { display:block; }
.quiz-actions { display:flex; gap:12px; margin-top:20px; }
.score-card {
  text-align:center; padding:32px;
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:var(--radius);
}
.score-card .score { font-size:3rem; font-weight:800; color:var(--aws-orange); }
.score-card .score-label { color:var(--text-muted); margin-top:4px; }

/* ── Tabs ── */
.tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--card-border); }
.tab {
  padding:10px 20px; cursor:pointer; font-size:.9rem;
  font-weight:600; color:var(--text-muted);
  border-bottom:2px solid transparent;
  transition: all .15s;
}
.tab:hover { color:var(--text); }
.tab.active { color:var(--aws-orange); border-bottom-color:var(--aws-orange); }
.tab-content { display:none; }
.tab-content.active { display:block; }

/* ── Accordion / Discussion ── */
.accordion { margin:12px 0; }
.accordion-header {
  padding:14px 18px; cursor:pointer;
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:var(--radius);
  display:flex; justify-content:space-between; align-items:center;
  font-weight:600; font-size:.92rem;
  transition:all .15s;
}
.accordion-header:hover { border-color:var(--aws-orange); }
.accordion-header .arrow { transition:transform .2s; }
.accordion-header.open .arrow { transform:rotate(90deg); }
.accordion-body {
  display:none; padding:16px 18px;
  border:1px solid var(--card-border);
  border-top:none; border-radius:0 0 var(--radius) var(--radius);
  background:var(--card-bg); font-size:.9rem;
}
.accordion-body.open { display:block; }

/* ── Flashcard ── */
.flashcard-deck { display:flex; flex-direction:column; align-items:center; gap:16px; }
.flashcard {
  width:100%; max-width:600px; min-height:200px;
  perspective:1000px; cursor:pointer;
}
.flashcard-inner {
  position:relative; width:100%; height:100%; min-height:200px;
  transition:transform .5s; transform-style:preserve-3d;
}
.flashcard.flipped .flashcard-inner { transform:rotateY(180deg); }
.flashcard-front, .flashcard-back {
  position:absolute; width:100%; min-height:200px;
  backface-visibility:hidden; border-radius:var(--radius);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:32px; text-align:center;
}
.flashcard-front {
  background: linear-gradient(135deg, #1f0e38, var(--royal-blue));
  border:1px solid var(--card-border);
}
.flashcard-back {
  background: linear-gradient(135deg, #1a2a1a, #0d170d);
  border:1px solid rgba(46,204,113,.3);
  transform:rotateY(180deg);
}
.flashcard-front h3 { color:var(--aws-orange); font-size:1.1rem; }
.flashcard-back p { font-size:.95rem; }
.flashcard-nav { display:flex; gap:12px; align-items:center; }
.flashcard-count { font-size:.85rem; color:var(--text-muted); }

/* ── Whiteboard / Diagram ── */
.diagram-box {
  background:rgba(0,0,0,.3); border:1px solid var(--card-border);
  border-radius:var(--radius); padding:24px;
  margin:16px 0; overflow-x:auto;
}
.diagram-box pre {
  font-family:'SF Mono','Cascadia Code',monospace;
  font-size:.8rem; line-height:1.5;
  color:var(--aws-teal); margin:0;
  border:none; background:transparent; padding:0;
}

/* ── Instructor Notes ── */
.instructor-note {
  border:1px dashed rgba(243,187,6,.3);
  background:rgba(243,187,6,.05);
  padding:16px 20px; border-radius:var(--radius);
  margin:16px 0; font-size:.88rem;
}
.instructor-note::before {
  content:'🎓 INSTRUCTOR NOTE'; display:block;
  font-size:.72rem; font-weight:700; color:var(--gold);
  letter-spacing:1px; margin-bottom:8px;
}

/* ── Landing / Welcome ── */
.landing { text-align:center; padding:60px 20px; max-width:700px; margin:0 auto; }
.landing h1 { font-size:2.4rem; margin-bottom:8px; }
.landing h1 span { color:var(--aws-orange); }
.landing .subtitle { font-size:1.15rem; color:var(--text-muted); margin-bottom:32px; }
.landing-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:16px;
  margin:32px 0; text-align:left;
}
.landing-card {
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:var(--radius); padding:20px;
}
.landing-card h3 { font-size:1rem; margin-bottom:4px; }
.landing-card p { font-size:.85rem; color:var(--text-muted); }
.landing-card .pct { font-size:1.6rem; font-weight:800; color:var(--aws-orange); }
.start-btn {
  padding:14px 48px; font-size:1.1rem; margin-top:24px;
  background: linear-gradient(135deg, var(--purple), var(--royal-blue));
  color:#fff; border:none; border-radius:var(--radius);
  font-weight:700; cursor:pointer; transition:all .2s;
}
.start-btn:hover { background: linear-gradient(135deg, #d48ef2, #0058cc); transform:scale(1.03); }

/* ── Responsive ── */
@media(max-width:900px) {
  .sidebar { display:none; }
  .main { padding:24px 16px; }
  .landing-grid { grid-template-columns:1fr; }
}

/* ── Animations ── */
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.fade-in { animation: fadeIn .35s ease; }

/* ── Lab styles ── */
.lab-step {
  display:flex; gap:16px; margin:16px 0;
  padding:16px; background:rgba(29,199,182,.04);
  border:1px solid rgba(29,199,182,.15);
  border-radius:var(--radius);
}
.lab-step-num {
  width:32px; height:32px; border-radius:50%;
  background:var(--aws-teal); color:#000;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:.9rem; flex-shrink:0;
}
</style>
</head>
<body>

<!-- ── Top Bar ── -->
<div class="topbar">
  <div class="topbar-brand">
    <span class="logo">▲</span> AWS ML Specialty — Exam Prep
  </div>
  <div class="topbar-timer">
    <div>
      <div class="timer-label">Session Time</div>
      <div class="timer-display" id="timer">00:00:00</div>
    </div>
    <button class="btn btn-outline btn-sm" id="timerToggle" onclick="toggleTimer()">Start</button>
    <button class="btn btn-outline btn-sm" onclick="resetTimer()">Reset</button>
  </div>
</div>

<!-- ── App Shell ── -->
<div class="app">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- Main Content -->
  <main class="main" id="mainContent"></main>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  DATA — Complete 4-Hour Curriculum
// ═══════════════════════════════════════════════════════════
const MODULES = [
  // ── WELCOME ──
  {
    id:'welcome', title:'Welcome & Overview', time:'10 min', domain:'overview',
    badge:'', badgeClass:'',
    content: () => `
      <div class="landing fade-in">
        <p style="font-size:.85rem;text-transform:uppercase;letter-spacing:3px;color:var(--cyan);font-weight:700;margin-bottom:12px">Building Our Tech — Exam Prep</p>
        <h1>AWS <span>Machine Learning</span> Specialty</h1>
        <p class="subtitle">MLS-C01 — 4-Hour Instructor-Led Exam Preparation</p>
        <div class="landing-grid">
          <div class="landing-card">
            <h3>Domain 1: Data Engineering</h3>
            <div class="pct">20%</div>
            <p>Data ingestion, transformation, storage solutions</p>
          </div>
          <div class="landing-card">
            <h3>Domain 2: Exploratory Data Analysis</h3>
            <div class="pct">24%</div>
            <p>Data visualization, feature engineering, statistics</p>
          </div>
          <div class="landing-card">
            <h3>Domain 3: Modeling</h3>
            <div class="pct">36%</div>
            <p>Algorithm selection, training, tuning, evaluation</p>
          </div>
          <div class="landing-card">
            <h3>Domain 4: ML Implementation & Ops</h3>
            <div class="pct">20%</div>
            <p>Deployment, security, monitoring, MLOps</p>
          </div>
        </div>
        <p style="color:var(--text-muted);font-size:.9rem;margin:16px 0">
          65 questions · 180 minutes · Scaled score 100–1000 (passing ~750)<br>
          Format: multiple choice & multiple response
        </p>
        <button class="start-btn" onclick="goToModule(1)">Begin Session →</button>
      </div>
    `
  },

  // ═══════════════════════════════════════════════════════════
  //  DOMAIN 1 — DATA ENGINEERING (55 min)
  // ═══════════════════════════════════════════════════════════
  {
    id:'d1-ingestion', title:'1.1 Data Ingestion & Collection', time:'15 min',
    domain:'Domain 1 · Data Engineering', badge:'Domain 1 — 20%', badgeClass:'badge-domain1',
    content: () => `
      <div class="fade-in">
        <div class="module-header">
          <span class="module-badge badge-domain1">Domain 1 — Data Engineering (20%)</span>
          <h1>Data Ingestion & Collection</h1>
          <p>How to move data from sources into AWS for ML workloads</p>
          <div class="module-meta">
            <span>⏱ 15 min</span><span>📖 Lecture + Discussion</span>
          </div>
        </div>

        <div class="content-card">
          <h2>Batch vs. Streaming Ingestion</h2>
          <table class="service-table">
            <tr><th>Pattern</th><th>AWS Services</th><th>Use Case</th></tr>
            <tr><td><strong>Batch</strong></td><td>AWS Glue, AWS Data Pipeline, S3 Transfer</td><td>Historical data, nightly ETL, large datasets</td></tr>
            <tr><td><strong>Streaming</strong></td><td>Kinesis Data Streams, Kinesis Firehose, MSK</td><td>Real-time inference, click-streams, IoT</td></tr>
            <tr><td><strong>Micro-batch</strong></td><td>Kinesis Firehose (buffered)</td><td>Near real-time with cost optimization</td></tr>
          </table>
        </div>

        <div class="content-card">
          <h2>Amazon Kinesis Family</h2>
          <h3>Kinesis Data Streams (KDS)</h3>
          <ul>
            <li>Real-time (~200ms latency), shard-based scaling</li>
            <li>1 MB/s in, 2 MB/s out per shard</li>
            <li>Data retention: 24 hours default, up to 365 days</li>
            <li>Consumer: KCL, Lambda, Kinesis Data Analytics</li>
          </ul>
          <h3>Kinesis Data Firehose</h3>
          <ul>
            <li>Near real-time (60s minimum buffer)</li>
            <li>Fully managed, auto-scaling, no shards to manage</li>
            <li>Destinations: S3, Redshift, OpenSearch, Splunk, HTTP</li>
            <li>Can transform data with Lambda before delivery</li>
          </ul>
          <h3>Kinesis Data Analytics</h3>
          <ul>
            <li>SQL or Apache Flink on streaming data</li>
            <li>Anomaly detection with <code>RANDOM_CUT_FOREST</code></li>
            <li>Tumbling, sliding, and stagger windows</li>
          </ul>

          <div class="exam-tip">
            If the question says <strong>"fully managed"</strong> and <strong>"near real-time delivery to S3"</strong> → Kinesis Firehose.<br>
            If it says <strong>"real-time"</strong> with <strong>"custom consumers"</strong> → Kinesis Data Streams.
          </div>
        </div>

        <div class="content-card">
          <h2>AWS Glue</h2>
          <ul>
            <li><strong>Glue Crawlers:</strong> discover schema, populate the Data Catalog</li>
            <li><strong>Glue ETL:</strong> serverless Spark, PySpark/Scala transforms</li>

      <div class="fade-in">
        <div class="module-header">
          <span class="module-badge badge-domain2">Domain 2 — Exploratory Data Analysis (24%)</span>
          <h1>Feature Engineering</h1>
          <p>Transforming raw data into features that improve model performance</p>

          <h2>Handling Missing Data</h2>
          <table class="service-table">
            <tr><th>Strategy</th><th>When to Use</th><th>Risk</th></tr>
            <tr><td><strong>Drop rows</strong></td><td>Small % missing, MCAR</td><td>Lose data; bias if not random</td></tr>
            <tr><td><strong>Drop feature</strong></td><td>>50% missing</td><td>Lose information</td></tr>
            <tr><td><strong>Mean/Median imputation</strong></td><td>Numerical, low missing %</td><td>Reduces variance</td></tr>
            <tr><td><strong>Mode imputation</strong></td><td>Categorical</td><td>May skew distribution</td></tr>
            <tr><td><strong>KNN imputation</strong></td><td>Complex patterns</td><td>Computationally expensive</td></tr>
            <tr><td><strong>MICE / Iterative</strong></td><td>Multiple features missing</td><td>Slow, complex</td></tr>
            <tr><td><strong>Indicator variable</strong></td><td>Missingness is informative</td><td>Adds a feature</td></tr>
          </table>
          <div class="exam-tip">
            Missing data terminology: <strong>MCAR</strong> (Missing Completely At Random), <strong>MAR</strong> (Missing At Random — depends on observed data), <strong>MNAR</strong> (Missing Not At Random — depends on unobserved data). The exam may test which imputation is appropriate for each.
          </div>
        </div>

        <div class="content-card">
          <h2>Encoding Categorical Variables</h2>
          <h3>One-Hot Encoding</h3>
          <ul>
            <li>Creates binary columns for each category</li>
            <li>Best for nominal (unordered) categories</li>
            <li>Watch out for high-cardinality features (1000s of categories)</li>
          </ul>
          <h3>Label / Ordinal Encoding</h3>
          <ul>
            <li>Maps categories to integers</li>
            <li>Preserves order for ordinal features</li>
            <li>Danger: tree-based models handle this well, linear models may infer false order</li>
          </ul>
          <h3>Target Encoding</h3>
          <ul>
            <li>Replace category with mean of target variable</li>
            <li>Risk of target leakage — must use cross-validation</li>
          </ul>
        </div>

        <div class="content-card">
          <h2>Feature Scaling</h2>
          <table class="service-table">
            <tr><th>Method</th><th>Formula</th><th>When</th></tr>
            <tr><td><strong>Normalization (Min-Max)</strong></td><td>(x - min) / (max - min) → [0,1]</td><td>Neural nets, KNN, algorithms sensitive to magnitude</td></tr>
            <tr><td><strong>Standardization (Z-score)</strong></td><td>(x - μ) / σ → mean=0, std=1</td><td>SVM, Logistic Regression, PCA</td></tr>
            <tr><td><strong>Robust Scaling</strong></td><td>(x - median) / IQR</td><td>When outliers are present</td></tr>
          </table>
          <div class="key-concept">
            <strong>Important:</strong> Tree-based algorithms (XGBoost, Random Forest) do NOT require feature scaling. Distance/gradient-based algorithms (KNN, SVM, Neural Networks, Linear/Logistic Regression) DO.
          </div>
        </div>

        <div class="content-card">
          <h2>Dimensionality Reduction</h2>
          <h3>PCA (Principal Component Analysis)</h3>
          <ul>
            <li>Unsupervised — finds orthogonal axes of maximum variance</li>
            <li>Available as SageMaker built-in algorithm</li>
            <li><strong>Regular mode:</strong> full dataset in memory</li>
            <li><strong>Randomized mode:</strong> approximation for large datasets</li>
            <li>Use when you have many correlated features → reduce multicollinearity</li>
          </ul>
          <h3>t-SNE / UMAP</h3>
          <ul>
            <li>Non-linear dimensionality reduction for visualization only</li>
            <li>t-SNE: good for cluster visualization in 2D/3D</li>
            <li>Not used for feature engineering — only for understanding data</li>
          </ul>
        </div>

        <div class="content-card">
          <h2>Handling Imbalanced Data</h2>
          <ul>
            <li><strong>SMOTE:</strong> Synthetic Minority Over-sampling Technique — creates synthetic minority samples</li>
            <li><strong>Random Over-sampling:</strong> duplicate minority class</li>
            <li><strong>Random Under-sampling:</strong> remove majority class</li>
            <li><strong>Class weights:</strong> tell the algorithm to penalize misclassifying minority class more</li>
            <li><strong>Anomaly detection approach:</strong> treat as unsupervised problem</li>
          </ul>
          <div class="exam-tip">
            For imbalanced datasets, <strong>accuracy is a misleading metric</strong>. Use Precision, Recall, F1-Score, or AUC-ROC instead. The exam frequently tests this concept.
          </div>
        </div>

        <div class="content-card">
          <h2>Feature Selection Methods</h2>
          <ul>
            <li><strong>Filter methods:</strong> Correlation, Chi-squared, ANOVA — fast, independent of model</li>
            <li><strong>Wrapper methods:</strong> Forward/Backward selection, RFE — uses model performance</li>
            <li><strong>Embedded methods:</strong> L1 (Lasso) regularization, tree feature importance — built into training</li>
          </ul>
        </div>

        <div class="instructor-note">

        </div>
      </div>

        <div class="module-header">

          <h1>SageMaker Training & Hyperparameter Tuning</h1>
          <p>Training infrastructure, input modes, and automatic model tuning</p>

        <div class="content-card">
          <h2>SageMaker Training Architecture</h2>
          <div class="diagram-box"><pre>
  ┌─────────────┐      ┌───────────────────────────────┐      ┌─────────────┐
  │   S3 Input  │─────▶│     Training Instance(s)      │─────▶│  S3 Output  │
  │  (Data)     │      │  ┌─────────────────────────┐  │      │ (model.tar) │
  │             │      │  │   Docker Container      │  │      │             │
  │             │      │  │  ┌───────────────────┐  │  │      │             │
  │             │      │  │  │ Training Script   │  │  │      │             │
  │             │      │  │  │ (your code or     │  │  │      │             │
  │             │      │  │  │  built-in algo)   │  │  │      │             │
  │             │      │  │  └───────────────────┘  │  │      │             │
  │             │      │  └─────────────────────────┘  │      │             │
  └─────────────┘      └───────────────────────────────┘      └─────────────┘
                              │             │
                        /opt/ml/input   /opt/ml/model
          </pre></div>
        </div>

        <div class="content-card">
          <h2>Training Input Modes</h2>
          <table class="service-table">
            <tr><th>Mode</th><th>How It Works</th><th>Best For</th></tr>
            <tr><td><strong>File Mode</strong></td><td>Downloads entire dataset to instance EBS</td><td>Small-medium datasets; repeated passes</td></tr>
            <tr><td><strong>Pipe Mode</strong></td><td>Streams data from S3 as a Linux FIFO pipe</td><td>Large datasets; faster start, no disk needed</td></tr>
            <tr><td><strong>FastFile Mode</strong></td><td>POSIX file interface backed by S3 streaming</td><td>Random access + large data (best of both)</td></tr>
          </table>
          <div class="exam-tip">
            <strong>Pipe Mode</strong> is often the answer when the question asks about training on very large datasets with reduced startup time and storage costs. FastFile is the newer option that combines benefits.
          </div>
        </div>

        <div class="content-card">
          <h2>Training Instance Types</h2>
          <table class="service-table">
            <tr><th>Family</th><th>Type</th><th>Use Case</th></tr>
            <tr><td><code>ml.m5.*</code></td><td>General purpose</td><td>XGBoost, Linear Learner, preprocessing</td></tr>
            <tr><td><code>ml.c5.*</code></td><td>Compute optimized</td><td>CPU-intensive algorithms</td></tr>
            <tr><td><code>ml.p3.*, ml.p4d.*</code></td><td>GPU</td><td>Deep learning (CNN, RNN, transformers)</td></tr>
            <tr><td><code>ml.g4dn.*</code></td><td>GPU (cost-effective)</td><td>Inference + light training</td></tr>
            <tr><td><code>ml.trn1.*</code></td><td>Trainium</td><td>Cost-optimized deep learning training</td></tr>
            <tr><td><code>ml.inf1.*</code></td><td>Inferentia</td><td>High-throughput inference</td></tr>

        <div class="content-card">
          <h2>Distributed Training Strategies</h2>
          <h3>Data Parallelism</h3>
          <ul>
            <li>Split data across multiple GPUs/instances</li>
            <li>Each has a full copy of the model</li>
            <li>Gradients are synchronized (AllReduce)</li>
            <li>Use when: dataset is large, model fits in single GPU memory</li>

          <ul>
            <li>Split the MODEL across multiple GPUs</li>
            <li>Each GPU holds a portion of layers</li>
            <li>Use when: model is too large for a single GPU</li>
          </ul>
          <div class="exam-tip">

            <li><strong>Bayesian Optimization</strong> (default) — learns from previous trials, most efficient</li>

            <strong>Warm Start:</strong> Automatic Model Tuning supports warm start — transfer knowledge from previous tuning jobs to new ones, saving time and cost.
          </div>
        </div>
      </div>

    id:'d3-evaluation', title:'3.3 Model Evaluation & Regularization', time:'20 min',
    domain:'Domain 3 · Modeling', badge:'Domain 3 — 36%', badgeClass:'badge-domain3',
    content: () => `
      <div class="fade-in">
        <div class="module-header">
          <span class="module-badge badge-domain3">Domain 3 — Modeling (36%)</span>
          <h1>Model Evaluation & Regularization</h1>
          <p>Metrics, validation strategies, and preventing overfitting</p>
          <div class="module-meta"><span>⏱ 20 min</span><span>📖 Lecture + Discussion</span></div>
        </div>

        <div class="content-card">
          <h2>Classification Metrics</h2>
          <table class="service-table">
            <tr><th>Metric</th><th>Formula</th><th>When to Optimize</th></tr>
            <tr><td><strong>Accuracy</strong></td><td>(TP+TN)/(TP+TN+FP+FN)</td><td>Balanced classes only</td></tr>
            <tr><td><strong>Precision</strong></td><td>TP/(TP+FP)</td><td>Minimize false positives (spam filter)</td></tr>
            <tr><td><strong>Recall (Sensitivity)</strong></td><td>TP/(TP+FN)</td><td>Minimize false negatives (disease detection)</td></tr>
            <tr><td><strong>F1 Score</strong></td><td>2×(P×R)/(P+R)</td><td>Balance precision and recall</td></tr>
            <tr><td><strong>AUC-ROC</strong></td><td>Area under ROC curve</td><td>Overall classifier performance; threshold-independent</td></tr>
            <tr><td><strong>Specificity</strong></td><td>TN/(TN+FP)</td><td>Minimize false positives for negative class</td></tr>
          </table>
          <div class="exam-tip">
            <strong>Key exam pattern:</strong><br>
            • "Minimize false negatives" (e.g., cancer screening) → optimize <strong>Recall</strong><br>
            • "Minimize false positives" (e.g., spam → inbox) → optimize <strong>Precision</strong><br>
            • Imbalanced dataset → use <strong>AUC-ROC</strong> or <strong>F1</strong>, NOT accuracy
          </div>
        </div>

        <div class="content-card">
          <h2>Confusion Matrix Deep Dive</h2>
          <div class="diagram-box"><pre>
                        Predicted
                    Positive  Negative
  Actual  Positive  [ TP    |   FN  ]     ← Recall = TP/(TP+FN)
          Negative  [ FP    |   TN  ]

          Precision = TP/(TP+FP)  ↑
          (column-wise)

  Type I Error  = False Positive (FP) — "crying wolf"
  Type II Error = False Negative (FN) — "missed detection"
          </pre></div>
        </div>

        <div class="content-card">
          <h2>Regression Metrics</h2>
          <table class="service-table">
            <tr><th>Metric</th><th>Notes</th></tr>
            <tr><td><strong>MSE (Mean Squared Error)</strong></td><td>Penalizes large errors more; sensitive to outliers</td></tr>
            <tr><td><strong>RMSE (Root MSE)</strong></td><td>Same units as target; most common regression metric</td></tr>
            <tr><td><strong>MAE (Mean Absolute Error)</strong></td><td>Robust to outliers; equal weight to all errors</td></tr>
            <tr><td><strong>R² (Coefficient of Determination)</strong></td><td>% of variance explained; 1 = perfect, 0 = baseline</td></tr>
            <tr><td><strong>MAPE</strong></td><td>Percentage-based; good for interpretability</td></tr>
          </table>
        </div>

        <div class="content-card">
          <h2>Overfitting vs Underfitting</h2>
          <table class="service-table">
            <tr><th></th><th>Underfitting (High Bias)</th><th>Overfitting (High Variance)</th></tr>
            <tr><td><strong>Symptom</strong></td><td>Poor on training AND validation</td><td>Great on training, poor on validation</td></tr>
            <tr><td><strong>Cause</strong></td><td>Model too simple</td><td>Model too complex; memorizing noise</td></tr>
            <tr><td><strong>Fix</strong></td><td>More features, complex model, less regularization</td><td>More data, regularization, simpler model, dropout</td></tr>
          </table>
        </div>

        <div class="content-card">
          <h2>Regularization Techniques</h2>
          <h3>L1 (Lasso) Regularization</h3>
          <ul>
            <li>Adds absolute value of weights to loss</li>
            <li>Drives some weights to exactly zero → feature selection</li>
            <li>Creates sparse models</li>
          </ul>
          <h3>L2 (Ridge) Regularization</h3>
          <ul>
            <li>Adds squared weights to loss</li>
            <li>Shrinks weights but doesn't zero them out</li>
            <li>Handles multicollinearity</li>
          </ul>
          <h3>Elastic Net</h3>
          <ul><li>Combines L1 + L2</li></ul>
          <h3>Dropout (Neural Networks)</h3>
          <ul>
            <li>Randomly drops neurons during training</li>
            <li>Prevents co-adaptation; acts like ensemble</li>
            <li>Typical rate: 0.2–0.5</li>
          </ul>
          <h3>Early Stopping</h3>
          <ul>
            <li>Stop training when validation loss stops improving</li>
            <li>Prevents training too long on noise</li>
          </ul>
          <div class="exam-tip">
            <strong>L1 → feature selection</strong> (zeroes out unimportant features).<br>
            <strong>L2 → prevents overfitting</strong> (shrinks all weights).<br>
            This distinction is tested frequently.
          </div>
        </div>

        <div class="content-card">
          <h2>Validation Strategies</h2>
          <ul>
            <li><strong>Train/Validation/Test Split:</strong> Typical 70/15/15 or 80/10/10</li>
            <li><strong>K-Fold Cross-Validation:</strong> K splits, train on K-1, validate on 1, rotate</li>
            <li><strong>Stratified K-Fold:</strong> Preserves class distribution in each fold — use for imbalanced data</li>
            <li><strong>Time-Series Split:</strong> Always train on past, validate on future — never shuffle!</li>
          </ul>
          <div class="key-concept">
            <strong>Data leakage:</strong> When information from the test set leaks into training. Common causes: scaling before splitting, using future data for past predictions, target encoding without cross-validation.
          </div>
        </div>

        <div class="instructor-note">
          <strong>Interactive exercise:</strong> Present a scenario: "Your model has 99% training accuracy and 60% validation accuracy." Ask students to diagnose (overfitting) and propose at least 3 solutions (more data, regularization, dropout, simpler model, early stopping, data augmentation).
        </div>
      </div>
    `
  },

    content: () => `
      <div class="fade-in">
        <div class="module-header">
          <span class="module-badge badge-domain3">Domain 3 — Modeling (36%)</span>
          <h1>Deep Learning Concepts</h1>
          <p>Neural networks, CNNs, RNNs, and transfer learning</p>
          <div class="module-meta"><span>⏱ 15 min</span><span>📖 Lecture</span></div>
        </div>

        <div class="content-card">
          <h2>Neural Network Fundamentals</h2>
          <h3>Activation Functions</h3>
          <table class="service-table">
            <tr><th>Function</th><th>Range</th><th>Use Case</th></tr>
            <tr><td><strong>ReLU</strong></td><td>[0, ∞)</td><td>Hidden layers (default choice); fast; avoids vanishing gradient</td></tr>
            <tr><td><strong>Sigmoid</strong></td><td>(0, 1)</td><td>Binary classification output; probabilities</td></tr>
            <tr><td><strong>Softmax</strong></td><td>(0, 1) sums to 1</td><td>Multi-class classification output</td></tr>
            <tr><td><strong>Tanh</strong></td><td>(-1, 1)</td><td>RNN hidden states; zero-centered</td></tr>
          </table>
          <div class="exam-tip">
            Output layer activation:<br>
            • Binary classification → <strong>Sigmoid</strong><br>
            • Multi-class classification → <strong>Softmax</strong><br>
            • Regression → <strong>Linear (no activation)</strong>
          </div>
        </div>

        <div class="content-card">
          <h2>CNN (Convolutional Neural Networks)</h2>
          <ul>
            <li><strong>Convolution layers:</strong> extract spatial features (edges, textures, patterns)</li>
            <li><strong>Pooling layers:</strong> reduce spatial dimensions (Max Pooling most common)</li>
            <li><strong>Fully Connected layers:</strong> final classification/regression</li>
            <li>Best for: image classification, object detection, semantic segmentation</li>
          </ul>
          <h3>Key Architectures</h3>
          <ul>
            <li><strong>ResNet:</strong> skip connections; used in SageMaker Image Classification</li>
            <li><strong>VGG:</strong> simple, deep; good for transfer learning</li>
            <li><strong>YOLO / SSD:</strong> real-time object detection</li>
          </ul>
        </div>

        <div class="content-card">
          <h2>RNN / LSTM / GRU</h2>
          <ul>
            <li><strong>RNN:</strong> sequential data, but suffers from vanishing gradient</li>
            <li><strong>LSTM:</strong> Long Short-Term Memory — gates (forget, input, output) to handle long sequences</li>
            <li><strong>GRU:</strong> Gated Recurrent Unit — simplified LSTM, fewer parameters</li>
            <li>Best for: time series, NLP, speech recognition</li>
            <li><strong>DeepAR</strong> uses LSTMs internally for time-series forecasting</li>
          </ul>
        </div>

        <div class="content-card">
          <h2>Transfer Learning</h2>
          <ul>
            <li>Use a pre-trained model (trained on large dataset) and fine-tune on your data</li>
            <li>Freeze early layers (general features), train later layers (specific features)</li>
            <li>SageMaker Image Classification supports transfer learning with ResNet</li>
            <li>Hugging Face models available on SageMaker for NLP transfer learning</li>
          </ul>
          <div class="key-concept">
            <strong>When to use:</strong> Small dataset + similar domain to pre-trained model = perfect for transfer learning. It dramatically reduces training time and data requirements.
          </div>
        </div>

        <div class="content-card">
          <h2>Optimizers</h2>
          <table class="service-table">
            <tr><th>Optimizer</th><th>Key Property</th></tr>
            <tr><td><strong>SGD</strong></td><td>Simple, may oscillate; good with momentum</td></tr>
            <tr><td><strong>Adam</strong></td><td>Adaptive learning rates; default choice for most DL</td></tr>
            <tr><td><strong>RMSprop</strong></td><td>Good for RNNs; adapts learning rate per parameter</td></tr>
            <tr><td><strong>Adagrad</strong></td><td>Adapts to sparse features; learning rate decays</td></tr>
          </table>
        </div>

        <div class="content-card">
          <h2>Vanishing & Exploding Gradients</h2>
          <ul>
            <li><strong>Vanishing:</strong> gradients shrink to ~0 in deep nets → early layers don't learn</li>
            <li>Solutions: ReLU activation, LSTM/GRU, Batch Normalization, skip connections (ResNet)</li>
            <li><strong>Exploding:</strong> gradients grow very large → unstable training</li>
            <li>Solutions: gradient clipping, proper weight initialization, lower learning rate</li>
          </ul>
        </div>
      </div>
    `
  },

// ═══════════════════════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════════════════════
let timerInterval = null, timerSeconds = 0, timerRunning = false;

function toggleTimer() {
  if (timerRunning) { clearInterval(timerInterval); timerRunning = false; document.getElementById('timerToggle').textContent = 'Resume'; }
  else { timerInterval = setInterval(() => { timerSeconds++; updateTimerDisplay(); }, 1000); timerRunning = true; document.getElementById('timerToggle').textContent = 'Pause'; }
}
function resetTimer() { clearInterval(timerInterval); timerSeconds = 0; timerRunning = false; updateTimerDisplay(); document.getElementById('timerToggle').textContent = 'Start'; }
function updateTimerDisplay() {
  const h = Math.floor(timerSeconds/3600), m = Math.floor((timerSeconds%3600)/60), s = timerSeconds%60;
  document.getElementById('timer').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════════════════
let currentModule = 0;
const completedModules = new Set();

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let html = `
    <div class="sidebar-progress">
      <div class="progress-text"><strong id="progressCount">0</strong> / ${MODULES.length} sections</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
    </div>
  `;
  let lastDomain = '';
  MODULES.forEach((m, i) => {
    if (m.domain !== lastDomain) {
      lastDomain = m.domain;
      html += `<div class="sidebar-section"><div class="sidebar-header">${m.domain}</div></div>`;
    }
    html += `<div class="sidebar-item ${i===currentModule?'active':''} ${completedModules.has(i)?'completed':''}" data-idx="${i}" onclick="goToModule(${i})">
      <span class="dot"></span>
      <span>${m.title}</span>
      <span class="time">${m.time}</span>
    </div>`;
  });
  sb.innerHTML = html;
}

function updateProgress() {
  const pct = Math.round((completedModules.size / MODULES.length) * 100);
  const bar = document.getElementById('progressBar');
  const count = document.getElementById('progressCount');
  if (bar) bar.style.width = pct + '%';
  if (count) count.textContent = completedModules.size;
}

function goToModule(idx) {
  if (currentModule !== idx && currentModule >= 0) completedModules.add(currentModule);
  currentModule = idx;
  const m = MODULES[idx];
  document.getElementById('mainContent').innerHTML = m.content();
  buildSidebar();
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ═══════════════════════════════════════════════════════════
//  QUIZ RENDERER
// ═══════════════════════════════════════════════════════════
const quizStates = {};

function renderQuiz(quizId, questions) {
  if (!quizStates[quizId]) quizStates[quizId] = { answers: {}, submitted: false, score: 0 };
  const st = quizStates[quizId];
  const letters = ['A','B','C','D','E'];

  let html = `<div class="fade-in">
    <div class="module-header">
      <h1>Knowledge Check</h1>
      <p>${questions.length} questions — select the best answer for each</p>
    </div>
    <div class="quiz-container" id="quiz-${quizId}">`;

  questions.forEach((q, qi) => {
    html += `<div class="quiz-question" id="${quizId}-q${qi}">
      <div class="q-num">Question ${qi+1} of ${questions.length}</div>
      <div class="q-text">${q.q}</div>`;
    q.opts.forEach((opt, oi) => {
      let cls = 'quiz-option';
      if (st.submitted) {
        if (oi === q.correct) cls += ' correct';
        else if (st.answers[qi] === oi) cls += ' incorrect';
      } else if (st.answers[qi] === oi) cls += ' selected';
      html += `<div class="${cls}" onclick="selectAnswer('${quizId}',${qi},${oi})">
        <span class="opt-letter">${letters[oi]}</span>
        <span>${opt}</span>
      </div>`;
    });
    html += `<div class="quiz-explanation ${st.submitted?'visible':''}" id="${quizId}-exp${qi}">
      <strong>${st.submitted && st.answers[qi] === q.correct ? '✓ Correct!' : st.submitted ? '✗ Incorrect.' : ''}</strong> ${q.explain}
    </div></div>`;
  });

  if (st.submitted) {
    html += `<div class="score-card">
      <div class="score">${st.score} / ${questions.length}</div>
      <div class="score-label">${Math.round(st.score/questions.length*100)}% — ${st.score/questions.length >= .75 ? 'Passing!' : 'Review recommended'}</div>
    </div>`;
    html += `<div class="quiz-actions"><button class="btn btn-outline" onclick="resetQuiz('${quizId}')">Retry Quiz</button>
      <button class="btn btn-orange" onclick="goToModule(${currentModule+1})">Continue →</button></div>`;
  } else {
    html += `<div class="quiz-actions">
      <button class="btn btn-orange" onclick="submitQuiz('${quizId}',${JSON.stringify(questions).replace(/"/g,'&quot;')})">Submit Answers</button>
    </div>`;
  }

  html += '</div></div>';
  return html;
}

function selectAnswer(quizId, qi, oi) {
  if (quizStates[quizId].submitted) return;
  quizStates[quizId].answers[qi] = oi;
  // re-render
  goToModule(currentModule);
}

function submitQuiz(quizId, questions) {
  const st = quizStates[quizId];
  st.submitted = true;
  st.score = 0;
  questions.forEach((q, qi) => { if (st.answers[qi] === q.correct) st.score++; });
  goToModule(currentModule);
}

function resetQuiz(quizId) {
  quizStates[quizId] = { answers: {}, submitted: false, score: 0 };
  goToModule(currentModule);
}

// ═══════════════════════════════════════════════════════════
//  FLASHCARDS
// ═══════════════════════════════════════════════════════════
const flashcardStates = {};

function renderFlashcards(deckId, cards) {
  if (!flashcardStates[deckId]) flashcardStates[deckId] = { idx: 0, flipped: false };
  const st = flashcardStates[deckId];
  const card = cards[st.idx];

  return `
    <div class="flashcard-deck" id="deck-${deckId}">
      <div class="flashcard ${st.flipped?'flipped':''}" onclick="flipCard('${deckId}')">
        <div class="flashcard-inner">
          <div class="flashcard-front">
            <p style="font-size:.75rem;color:var(--text-muted);margin-bottom:12px">CLICK TO REVEAL</p>
            <h3>${card.front}</h3>
          </div>
          <div class="flashcard-back">
            <p style="font-size:.75rem;color:var(--success);margin-bottom:12px">ANSWER</p>
            <p>${card.back}</p>
          </div>
        </div>
      </div>
      <div class="flashcard-nav">
        <button class="btn btn-outline btn-sm" onclick="prevCard('${deckId}',${cards.length})" ${st.idx===0?'disabled':''}>← Prev</button>
        <span class="flashcard-count">${st.idx+1} / ${cards.length}</span>
        <button class="btn btn-outline btn-sm" onclick="nextCard('${deckId}',${cards.length})" ${st.idx===cards.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
  `;
}

function flipCard(deckId) {
  flashcardStates[deckId].flipped = !flashcardStates[deckId].flipped;
  goToModule(currentModule);
}
function nextCard(deckId, total) {
  const st = flashcardStates[deckId];
  if (st.idx < total-1) { st.idx++; st.flipped = false; goToModule(currentModule); }
}
function prevCard(deckId, total) {
  const st = flashcardStates[deckId];
  if (st.idx > 0) { st.idx--; st.flipped = false; goToModule(currentModule); }
}

// ═══════════════════════════════════════════════════════════
//  ACCORDION
// ═══════════════════════════════════════════════════════════
function toggleAccordion(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
buildSidebar();
goToModule(0);
</script>
</body>
</html>
